<!DOCTYPE html><html><head><meta charset="utf-8"><title>Phoenix Bridge</title></head><body><script>
(function(){
 'use strict';
 const allowedOrigin='https://phanupongsaki.github.io';
 const channel='phoenix-rpc';
 const methods=new Set(["getRealtimeVersion","getOrgData","saveOrgData","saveReorderedData","deleteOrgData","testConnection","getOrganizationProfile","saveOrganizationProfile","getPositionsByOrganization","savePositions","deletePositionsByOrganization","getAllPositionsSummary","getManagementSummary","secInitSheets","secGetDashboard","secGetTeams","secGetMembers","secGetTierHistory","secGetBudgets","secGetTeamDetail","secGetMemberDetail","secGetOrganizationOptions","secGetBudgetOrganizationTree","secGetPositionOptions","secDeleteTeam","secSaveTeam","secSaveMember","secChangeMemberPersonal","secGetMemberHistory","secChangeMemberPosition","secDeleteMember","secReorderMembers","secPromoteMember","secGetBudgetSources","secGetBudgetConfig","secSaveBudgetSource","secDeleteBudgetSource","secSaveBudgetConfig","secTransferBudgetReserve","secGetCentralBudgets","secSaveCentralBudget","secDeleteCentralBudget","secGetEmergencyExpenses","secSaveEmergencyExpense","secDeleteEmergencyExpense","secGetBudgetUnits","secSaveBudgetUnit","secSaveBudget","secApproveBudget"]);
 function respond(type,id,extra){window.parent.postMessage(Object.assign({channel:channel,type:type,id:id},extra||{}),allowedOrigin);}
 window.addEventListener('message',function(event){
  if(event.source!==window.parent||event.origin!==allowedOrigin)return;
  const msg=event.data;
  if(!msg||msg.channel!==channel||typeof msg.id!=='string')return;
  if(msg.type==='ping'){respond('ready',msg.id);return;}
  if(msg.type!=='call')return;
  if(typeof msg.method!=='string'||!methods.has(msg.method)){respond('error',msg.id,{message:'Method not allowed: '+String(msg.method)});return;}
  try{
   const runner=google.script.run.withSuccessHandler(function(result){respond('success',msg.id,{value:result});}).withFailureHandler(function(error){respond('error',msg.id,{message:error&&error.message?error.message:String(error)});});
   runner[msg.method].apply(runner,Array.isArray(msg.args)?msg.args:[]);
  }catch(error){respond('error',msg.id,{message:error&&error.message?error.message:String(error)});}
 });
 respond('loaded','init');
})();
</script></body></html>
